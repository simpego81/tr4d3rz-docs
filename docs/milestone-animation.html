<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<title>TR4D3RZ — Roadmap</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02060e;font-family:'Segoe UI',system-ui,sans-serif}

#shell{
  position:fixed;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:92vw;height:94vh;
  display:flex;flex-direction:column;
  background:#050c18;border:1px solid #162035;
  border-radius:10px;box-shadow:0 0 80px #000c;overflow:hidden;
}

/* header */
#hdr{
  flex-shrink:0;height:46px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.4rem;background:#030810;border-bottom:1px solid #162035;
}
.h-ms{font-size:.6rem;letter-spacing:.28em;color:#3b82f6;text-transform:uppercase;width:40px}
.h-title{font-size:.95rem;font-weight:700;color:#f0f6ff;letter-spacing:.04em;flex:1;text-align:center}
.h-ann{font-size:.68rem;color:#334155;letter-spacing:.06em;width:120px;text-align:right;margin-right:.6rem}
.h-pill{font-size:.62rem;padding:.18rem .65rem;border-radius:10px;font-weight:600;letter-spacing:.05em;flex-shrink:0}
.pd{background:#052e16;color:#4ade80;border:1px solid #166534}
.pa{background:#1c1407;color:#fbbf24;border:1px solid #92400e;animation:pa 2s infinite}
.pp{background:#1e1b4b;color:#a5b4fc;border:1px solid #3730a3}
@keyframes pa{0%,100%{box-shadow:0 0 0 0 #fbbf2430}50%{box-shadow:0 0 0 5px transparent}}

/* diagram: SVG fills all remaining space */
#diagram{
  flex:1;position:relative;overflow:hidden;
  display:flex;align-items:stretch;justify-content:stretch;
}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s}
.scene.active{opacity:1;pointer-events:all}
.scene svg{width:100%;height:100%}

/* nav */
#nav{
  flex-shrink:0;height:38px;
  display:flex;align-items:center;justify-content:center;gap:.55rem;
  background:#030810;border-top:1px solid #0e1c30;
}
.nb{background:transparent;border:1px solid #1a2e4a;color:#3d5270;
  padding:.3rem .95rem;border-radius:5px;font-size:.75rem;cursor:pointer;
  transition:all .15s;letter-spacing:.04em}
.nb:hover{background:#1a2e4a;border-color:#3b82f6;color:#93c5fd}
.nb:disabled{opacity:.15;cursor:not-allowed}
.dot{width:7px;height:7px;border-radius:50%;background:#162035;
  cursor:pointer;transition:all .22s;border:none;flex-shrink:0}
.dot.active{background:#3b82f6;width:22px;border-radius:3px;box-shadow:0 0 6px #3b82f680}
.dot:hover{background:#2d4a7a}

/* SVG common */
.ann{transition:opacity .3s}
@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes dl{from{stroke-dashoffset:var(--l,400)}to{stroke-dashoffset:0}}
@keyframes pkt{0%{offset-distance:0%;opacity:0}8%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes fb{from{width:0}to{width:var(--w)}}

/* scanlines */
#shell::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:900;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.022) 3px,rgba(0,0,0,.022) 4px);
  border-radius:10px}
</style>
</head>

<script>
// ── low-level SVG helpers ────────────────────────────────────────────────────
const D=(d,s='.45')=>`style="animation:appear .45s ${s}s ease both;opacity:0"`;
function ap(d=0,dur='.45'){return `style="animation:appear ${dur}s ${d}s ease both;opacity:0"`}
function dl(x1,y1,x2,y2,col,d=0,id='x'){
  const len=Math.hypot(x2-x1,y2-y1);
  const ax=x2-6*Math.cos(Math.atan2(y2-y1,x2-x1)), ay=y2-6*Math.sin(Math.atan2(y2-y1,x2-x1));
  return `<defs><marker id="ah${id}" markerWidth="5" markerHeight="4" refX="4" refY="2" orient="auto">
    <polygon points="0,0 5,2 0,4" fill="${col}"/></marker></defs>
    <line x1="${x1}" y1="${y1}" x2="${ax}" y2="${ay}" stroke="${col}" stroke-width="1.3" opacity=".6"
      marker-end="url(#ah${id})" stroke-dasharray="${len}" stroke-dashoffset="${len}"
      style="animation:dl .5s ${d}s ease both;--l:${len}"/>`;
}
function pkt(path,col,d,dur=2.4){
  return `<circle r="3.5" fill="${col}" style="offset-path:path('${path}');animation:pkt ${dur}s ${d}s linear infinite"/>`;
}
// UML node box (stereotype header)
function uNode(x,y,w,h,name,stereo,col,d,inner=''){
  return `<g ${ap(d)}>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${col}0c" stroke="${col}" stroke-width="1.6"/>
    <rect x="${x}" y="${y}" width="${w}" height="19" rx="3" fill="${col}1a" stroke="${col}" stroke-width="1.6"/>
    <rect x="${x}" y="${y+16}" width="${w}" height="3" fill="${col}1a"/>
    <text x="${x+w/2}" y="${y+7.5}" text-anchor="middle" font-size="6" fill="${col}99" letter-spacing=".14em">«${stereo}»</text>
    <text x="${x+w/2}" y="${y+15}" text-anchor="middle" font-size="9.5" fill="${col}" font-weight="700">${name}</text>
    ${inner}
  </g>`;
}
// artifact row inside a node
function art(x,y,w,name,col,d){
  return `<g ${ap(d,.35)}>
    <rect x="${x}" y="${y}" width="${w}" height="16" rx="2" fill="${col}0e" stroke="${col}50" stroke-width="1"/>
    <text x="${x+w/2}" y="${y+10.5}" text-anchor="middle" font-size="7.5" fill="${col}cc">${name}</text>
  </g>`;
}
// cylinder (database)
function cyl(x,y,w,h,name,col,d){
  return `<g ${ap(d,.35)}>
    <rect x="${x}" y="${y+6}" width="${w}" height="${h}" rx="2" fill="${col}0c" stroke="${col}48" stroke-width="1"/>
    <ellipse cx="${x+w/2}" cy="${y+6}" rx="${w/2}" ry="5.5" fill="${col}18" stroke="${col}55" stroke-width="1"/>
    <text x="${x+w/2}" y="${y+h/2+10}" text-anchor="middle" font-size="7.5" fill="${col}aa">${name}</text>
  </g>`;
}
// annotation callout (always in right column x≥720)
function ann(si,ai,bx,by,bw,bh,col,title,lines,px1,py1,px2,py2){
  const lid=`${si}-${ai}`;
  const lineH=12, ty=by+14;
  const linesHtml=lines.map((l,i)=>`<text x="${bx+10}" y="${ty+14+i*lineH}" font-size="8" fill="#7a8fa8">${l}</text>`).join('');
  return `<g id="ann-${lid}" class="ann" opacity="0">
    <line x1="${px1}" y1="${py1}" x2="${px2}" y2="${py2}"
      stroke="${col}" stroke-width="1" stroke-dasharray="5 3" opacity=".7"/>
    <circle cx="${px2}" cy="${py2}" r="3" fill="${col}" opacity=".8"/>
    <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="5"
      fill="#060e1c" stroke="${col}" stroke-width="1.4"/>
    <rect x="${bx}" y="${by}" width="${bw}" height="16" rx="5" fill="${col}18"/>
    <rect x="${bx}" y="${by+13}" width="${bw}" height="3" fill="${col}18"/>
    <text x="${bx+10}" y="${by+11}" font-size="7.5" fill="${col}" font-weight="700" letter-spacing=".1em">${title}</text>
    ${linesHtml}
  </g>`;
}

// ── ENGINE ────────────────────────────────────────────────────────────────────
const diagramEl = document.getElementById('diagram');
const dotsEl    = document.getElementById('dots');
let cur = 0, annotStep = -1;

// Build scene divs
SCENES.forEach((sc, i) => {
  const div = document.createElement('div');
  div.className = 'scene'; div.id = `sc${i}`;
  div.innerHTML = sc.svg();
  diagramEl.appendChild(div);
  const dot = document.createElement('button');
  dot.className = 'dot'; dot.title = sc.ms;
  dot.onclick = () => jumpScene(i);
  dotsEl.appendChild(dot);
});

function getAnn(si, ai) {
  return document.querySelector(`#sc${si} #ann-${si}-${ai}`);
}
function showAnn(si, ai) {
  const el = getAnn(si, ai);
  if (el) el.style.opacity = '1';
}
function hideAnn(si, ai) {
  const el = getAnn(si, ai);
  if (el) el.style.opacity = '0';
}
function hideAllAnns(si) {
  const sc = SCENES[si];
  for (let i = 0; i < sc.annotCount; i++) hideAnn(si, i);
}

function updateHeader() {
  const sc = SCENES[cur];
  document.getElementById('hMs').textContent    = sc.ms;
  document.getElementById('hTitle').textContent = sc.title;
  const pill = document.getElementById('hPill');
  pill.textContent = sc.badge; pill.className = `h-pill ${sc.pill}`;
  const annEl = document.getElementById('hAnn');
  annEl.textContent = annotStep >= 0
    ? `nota ${annotStep + 1} / ${sc.annotCount}`
    : `→ per le note`;
}

function goScene(idx) {
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
  document.getElementById(`sc${idx}`).classList.add('active');
  cur = idx; annotStep = -1;
  updateHeader();
  document.getElementById('bPrev').disabled = idx === 0 && annotStep < 0;
  document.getElementById('bNext').disabled = false;
}

function jumpScene(idx) {
  hideAllAnns(cur);
  goScene(idx);
  document.getElementById('bPrev').disabled = idx === 0;
}

function next() {
  const sc = SCENES[cur];
  if (annotStep < sc.annotCount - 1) {
    if (annotStep >= 0) hideAnn(cur, annotStep);
    annotStep++;
    showAnn(cur, annotStep);
    updateHeader();
    document.getElementById('bPrev').disabled = false;
    document.getElementById('bNext').disabled = annotStep === sc.annotCount - 1 && cur === SCENES.length - 1;
  } else if (cur < SCENES.length - 1) {
    hideAllAnns(cur);
    goScene(cur + 1);
  }
}

function prev() {
  if (annotStep > 0) {
    hideAnn(cur, annotStep);
    annotStep--;
    showAnn(cur, annotStep);
    updateHeader();
    document.getElementById('bNext').disabled = false;
  } else if (annotStep === 0) {
    hideAnn(cur, 0);
    annotStep = -1;
    updateHeader();
    document.getElementById('bPrev').disabled = cur === 0;
  } else if (cur > 0) {
    goScene(cur - 1);
    const sc = SCENES[cur];
    annotStep = sc.annotCount - 1;
    showAnn(cur, annotStep);
    updateHeader();
  }
}

document.getElementById('bNext').onclick = next;
document.getElementById('bPrev').onclick = prev;
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); prev(); }
});

goScene(0);
</script>
